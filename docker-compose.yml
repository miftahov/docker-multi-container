services:

  # Простой docker-контейнер для проверки работы docker-compose
  simple-container:
    image: alpine
    container_name: $APP_NAME-simple-container
    command: "echo 'Hello from Docker Compose!'"

  # Docker-контейнер c мультиплексным web-сервером NGINX
  nginx:
    image: nginx:alpine
    container_name: $APP_NAME-nginx
    working_dir: /var/www
    volumes:
      - .:/var/www
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    ports:
      - $WEBSERVER_PORT:80

  # Docker-контейнер с Fast-CGI менеджером процессов интерпретатора PHP - php-fpm
  php-fpm:
    build: docker/php-fpm
    container_name: $APP_NAME-php-fpm
    working_dir: /var/www
    volumes:
      - .:/var/www
      - ./docker/php-fpm/overrides.ini:/usr/local/etc/php/conf.d/overrides.ini
